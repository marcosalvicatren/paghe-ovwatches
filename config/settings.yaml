# Impostazioni generali. I valori qui sono di default e possono essere
# sovrascritti dai controlli nell'interfaccia (data, causale, conto
# contropartita), che restano la fonte di verità per una singola sessione.

xml:
  xsd_filename: "SchemaImportazionePrimaNotaV2.xsd"
  causale_contabile_default: "LA"

f24:
  # nessun conto di contropartita di default: va impostato esplicitamente
  # nell'interfaccia (di solito il conto banca del cliente), per non
  # applicare un conto arbitrario a scritture di clienti diversi.
  conto_contropartita_default: ""

estrazione:
  # soglia di similarità testuale (0-1) sopra la quale due pagine bilancino
  # o due copie F24 vengono considerate duplicati e scartate
  soglia_duplicato: 0.92
